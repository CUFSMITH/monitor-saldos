<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Saldos Bancarios</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0e1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    img {
      max-width: 95%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .info {
      margin-top: 15px;
      font-size: 14px;
      color: #8b949e;
    }
    #loading {
      font-size: 16px;
      color: #58a6ff;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="loading">Cargando último reporte en vivo...</div>
  <img id="dashboard" style="display: none;" alt="Monitor de saldos">
  <div class="info">Actualización automática cada 1 hora. Se refresca en vivo cada 30 segundos.</div>

  <script>
    function actualizarDashboard() {
      const imgElem = document.getElementById("dashboard");
      const loadingElem = document.getElementById("loading");
      
      // Creamos una imagen temporal en memoria para precargarla sin parpadeos
      const nuevaImg = new Image();
      // Usamos ruta relativa al repo con timestamp único para forzar refresco
      nuevaImg.src = "./dashboard_saldos.png?nocache=" + new Date().getTime();
      
      nuevaImg.onload = function() {
        imgElem.src = nuevaImg.src;
        imgElem.style.display = "block";
        if (loadingElem) {
          loadingElem.style.display = "none";
        }
      };

      nuevaImg.onerror = function() {
        // Fallback a GitHub Raw con timestamp si GitHub Pages tarda en sincronizar
        nuevaImg.src = "https://raw.githubusercontent.com/CUFSMITH/monitor-saldos/main/dashboard_saldos.png?nocache=" + new Date().getTime();
      };
    }

    // Carga inicial inmediata
    actualizarDashboard();

    // Actualiza cada 30 segundos
    setInterval(actualizarDashboard, 30000);
  </script>
</body>
</html>
